[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "papaia-misc-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "feedparser>=6.0,<7", "apscheduler>=3.11,<4", "python-multipart>=0.0.20", "PyJWT>=2.10,<3", "beautifulsoup4>=4.13,<5"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
